name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --locked --workspace
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Build desktop
        run: cargo build --locked --release -p docuforge
      - name: Build PDF merge command
        run: cargo build --locked --release -p docuforge-pdf --bin docuforge-merge
      - name: Upload smoke-test binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docuforge-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            target/release/docuforge${{ runner.os == 'Windows' && '.exe' || '' }}
            target/release/docuforge-merge${{ runner.os == 'Windows' && '.exe' || '' }}
