[workspace]
members = [
    "apps/desktop",
    "crates/docuforge-core",
    "crates/docuforge-jobs",
    "crates/docuforge-pdf",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
dioxus = "~0.7.10"
lopdf = { version = "~0.47.0", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
docuforge-core = { path = "crates/docuforge-core" }
docuforge-jobs = { path = "crates/docuforge-jobs" }
docuforge-pdf = { path = "crates/docuforge-pdf" }
